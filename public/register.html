<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Student Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="auth-page">
  <a class="brand auth-brand" href="/">folio<span>.</span></a>
  <main class="auth-card">
    <p class="eyebrow">LET'S GET STARTED</p>
    <h1>Create your account</h1>
    <p class="muted">Start building your student portfolio.</p>
    <form id="registerForm">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="At least 6 characters" minlength="6" required>
      <button class="button full" type="submit">Create account</button>
      <p id="registerMessage" class="message"></p>
    </form>
    <p class="auth-switch">Already registered? <a href="/login.html">Log in</a></p>
  </main>
  <footer>© 2026 Student Portfolio Management System</footer>
</body>
</html>
